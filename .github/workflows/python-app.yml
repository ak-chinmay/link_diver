name: link diver

on:
  schedule:
    - cron: "17 01 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: link-diver-delivery
      cancel-in-progress: false
    env:
      CONTENT_SOURCES: ${{ vars.CONTENT_SOURCES || 'todoist,twitter_cookie' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TODOIST_PROJECT_ID: ${{ secrets.TODOIST_PROJECT_ID }}
      TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_BOOKMARK_LIMIT: ${{ vars.X_BOOKMARK_LIMIT || '100' }}
      X_USER_ID: ${{ vars.X_USER_ID }}
      REQUEST_TIMEOUT: ${{ vars.REQUEST_TIMEOUT || '30' }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m flake8 driver.py link_diver tests --max-line-length=88
      - name: Run unit tests
        run: python -m pytest
      - name: Install Chromium for cookie source
        if: ${{ contains(env.CONTENT_SOURCES, 'twitter_cookie') }}
        run: python -m playwright install --with-deps chromium
      - name: Validate source configuration
        run: python -c "from link_diver.config import Settings; Settings.from_env()"
      - name: Select content and send to Telegram
        run: bash link_diver.sh
